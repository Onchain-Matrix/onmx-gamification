<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow,noarchive">
<meta name="referrer" content="no-referrer">
<title>Signals review</title>
<style>
:root{--bg:#030612;--card:#081121;--line:rgba(7,233,251,.18);--txt:#F4FBFF;--mute:#8FA3BF;--cyan:#07E9FB;--violet:#8B4FF5;--mint:#00ff88;--red:#ff8a8a}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--txt);font:14px/1.45 Inter,system-ui,sans-serif}
.wrap{max-width:1100px;margin:auto;padding:16px}h1{font-size:18px;margin:0 0 8px}h2{font-size:14px;margin:0}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin:10px 0}
input,select,textarea{background:#0a1220;border:1px solid var(--line);color:var(--txt);border-radius:8px;padding:7px 9px;font:inherit}
button{cursor:pointer;background:linear-gradient(135deg,var(--violet),#6f5fe0);color:#fff;border:0;border-radius:8px;padding:7px 12px;font-weight:700}
button.ghost{background:transparent;border:1px solid var(--line)}button.danger{background:#7a2433}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}.mute{color:var(--mute);font-size:12px}a{color:var(--cyan)}
.flag{display:inline-block;font-size:11px;border-radius:99px;padding:1px 7px;border:1px solid var(--line);color:var(--mute);margin-right:4px}.flag.warn{color:#ffd27a;border-color:#ffd27a66}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:6px;margin-top:8px}
.why{white-space:pre-wrap;background:#050b17;border-radius:8px;padding:8px;margin:6px 0}
.tabs button{background:transparent;border:1px solid var(--line)}.tabs button.on{background:linear-gradient(135deg,var(--cyan),#5887F4);color:#030612}
#msg{min-height:1.4em}
</style></head><body><div class="wrap">
<h1>Matrix Signals — reviewer console</h1>
<p class="mute">Private, unlisted. The admin token stays in this tab (sessionStorage) and is only sent to the claims Worker. Approving a signal writes Credits to the ledger; rejecting writes none.</p>
<div class="card row" id="auth">
  <input id="tok" type="password" placeholder="Admin token" size="40" autocomplete="off" aria-label="Admin token">
  <button id="tokSave">Unlock</button><button class="ghost" id="tokClear">Forget token</button><span id="who" class="mute"></span>
</div>
<div class="card row tabs" id="ctl" hidden>
  <button data-st="pending" class="on">Pending</button><button data-st="approved">Approved</button><button data-st="rejected">Rejected</button><button data-st="all">All</button>
  <span style="flex:1"></span>
  <button class="ghost" id="csv">Download Signal Log CSV</button>
  <button class="ghost" id="players">Players</button>
  <button class="danger" id="purge">Purge preview rows</button>
</div>
<div id="msg" class="mute" aria-live="polite"></div>
<div id="list"></div>
</div>
<script type="module">
const API = "https://onmx-gamification-claims.onmx.workers.dev";
const KEY = "onmx_admin_token";
const BASE = { reply: 5, quote: 4, connect: 6, discover: 6, standalone: 2 };
const MULT = { accepted: 1, strong: 2, outstanding: 4 };
const BONUS = { kolReplied: 5, kolFollowed: 3, directInterest: 5, introduction: 15 };
const BONUS_LABEL = { kolReplied: "Target account replied", kolFollowed: "Target followed @Onchain_Matrix", directInterest: "Someone asked about ONMX / DM", introduction: "Introduction / partnership lead" };
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const xLink = u => (typeof u === "string" && /^https:\/\/x\.com\/[A-Za-z0-9_]{1,15}(\/status\/\d+)?$/.test(u)) ? `<a href="${esc(u)}" target="_blank" rel="noopener noreferrer nofollow">${esc(u.replace("https://", ""))}</a>` : "—";
let tok = sessionStorage.getItem(KEY) || "";
let status = "pending";
const $ = s => document.querySelector(s);
const msg = t => { $("#msg").textContent = t; };
async function api(path, { method = "GET", body } = {}) {
  const r = await fetch(API + path, { method, headers: { Authorization: "Bearer " + tok, ...(body ? { "Content-Type": "application/json" } : {}) }, body: body ? JSON.stringify(body) : undefined, credentials: "omit" });
  if (path.endsWith(".csv")) return r;
  let j = null; try { j = await r.json(); } catch {}
  return { status: r.status, json: j };
}
async function unlock() {
  const r = await api("/v1/admin/ping");
  if (r.status !== 200) { $("#who").textContent = "Token rejected (" + r.status + ")"; $("#ctl").hidden = true; $("#list").innerHTML = ""; return; }
  $("#who").textContent = "Unlocked · Signals open: " + (r.json.signals.open ? "yes" : "no (preview only)");
  $("#ctl").hidden = false; load();
}
function credits(type, tier, o) { let b = 0; for (const k in BONUS) if (o[k]) b += BONUS[k]; return (BASE[type] || 0) * (MULT[tier] || 0) + Math.min(25, b); }
function card(s) {
  const f = s.flags || {};
  const flags = [s.preview ? `<span class="flag">preview</span>` : "", f.firstApproval && s.status === "pending" ? `<span class="flag">first signal</span>` : "",
    s.referrer ? `<span class="flag">referred by ${esc(s.referrer)}</span>` : "", f.sameIpAsReferrer ? `<span class="flag warn">same network as referrer</span>` : "",
    f.otherSignalsOnTarget ? `<span class="flag warn">${f.otherSignalsOnTarget} other signal(s) on this target</span>` : ""].join("");
  const o = s.outcomes || {};
  const outcomeInputs = `<div class="grid">${Object.keys(BONUS).map(k => `<label class="mute"><input type="checkbox" data-o="${k}" ${o[k] ? "checked" : ""}> ${BONUS_LABEL[k]} (+${BONUS[k]})</label>`).join("")}
    <label class="mute">Impressions <input data-m="impressions" type="number" min="0" value="${o.impressions ?? ""}" style="width:100%"></label>
    <label class="mute">Replies generated <input data-m="repliesGenerated" type="number" min="0" value="${o.repliesGenerated ?? ""}" style="width:100%"></label>
    <label class="mute">Likes <input data-m="likes" type="number" min="0" value="${o.likes ?? ""}" style="width:100%"></label></div>
    <input data-m="notes" placeholder="Outcome / notes" value="${esc(o.notes || "")}" style="width:100%;margin-top:6px">`;
  const actions = s.status === "pending" ? `${outcomeInputs}
      <div class="row" style="margin-top:8px"><select data-tier><option value="accepted">Accepted</option><option value="strong">Strong</option><option value="outstanding">Outstanding</option></select>
      <span class="mute" data-calc></span><button data-act="approve">Approve</button>
      <input data-reason placeholder="Reject reason (shown to player)" size="34"><button class="danger" data-act="reject">Reject</button></div>`
    : s.status === "approved" ? `${outcomeInputs}<div class="row" style="margin-top:8px"><button class="ghost" data-act="outcomes">Save outcomes (recalculate bonus)</button>
      <input data-reason placeholder="Revoke reason" size="30"><button class="danger" data-act="revoke">Revoke</button></div>` : "";
  return `<div class="card" data-id="${esc(s.id)}" data-type="${esc(s.type)}">
    <div class="row"><h2>${esc(s.handle)} · ${esc(s.type)} · ${esc(s.topic)}</h2><span class="mute">${esc(s.submittedAt)}</span>
      <span class="flag">${esc(s.status)}${s.status === "approved" ? " · " + esc(s.tier) + " · " + s.credits + " Credits" : ""}</span>${flags}</div>
    <div class="mute">Signal: ${xLink(s.signalUrl)} · Target: ${xLink(s.targetUrl)} ${s.targetHandle ? "(" + esc(s.targetHandle) + ")" : ""} · ONMX mentioned: ${s.onmxMentioned ? "yes" : "no"}</div>
    <div class="why">${esc(s.why)}</div>${s.rejectReason ? `<div class="mute">Reason: ${esc(s.rejectReason)}</div>` : ""}${actions}</div>`;
}
function readOutcomes(el) {
  const o = {}; el.querySelectorAll("[data-o]").forEach(i => o[i.dataset.o] = i.checked);
  el.querySelectorAll("[data-m]").forEach(i => { o[i.dataset.m] = i.dataset.m === "notes" ? i.value : (i.value === "" ? null : Number(i.value)); });
  return o;
}
async function load() {
  msg("Loading…");
  const r = await api("/v1/admin/signals?status=" + status + "&limit=200");
  if (r.status !== 200) { msg("Load failed: " + (r.json?.error || r.status)); return; }
  $("#list").innerHTML = r.json.signals.length ? r.json.signals.map(card).join("") : `<div class="card mute">Nothing here.</div>`;
  msg(r.json.signals.length + " signal(s)");
  document.querySelectorAll("#list .card[data-id]").forEach(el => {
    const calc = () => { const c = el.querySelector("[data-calc]"); const t = el.querySelector("[data-tier]"); if (c && t) c.textContent = "= " + credits(el.dataset.type, t.value, readOutcomes(el)) + " Credits"; };
    el.querySelectorAll("input,select").forEach(i => i.addEventListener("input", calc)); calc();
    el.querySelectorAll("[data-act]").forEach(b => b.onclick = async () => {
      const id = el.dataset.id, act = b.dataset.act;
      const body = act === "approve" ? { tier: el.querySelector("[data-tier]").value, outcomes: readOutcomes(el) }
        : act === "outcomes" ? { outcomes: readOutcomes(el) } : { reason: el.querySelector("[data-reason]").value };
      if ((act === "reject" || act === "revoke") && (body.reason || "").trim().length < 3) { msg("Add a reason first."); return; }
      b.disabled = true;
      const res = await api(`/v1/admin/signals/${id}/${act}`, { method: "POST", body });
      if (res.status !== 200) { msg(act + " failed: " + (res.json?.error || res.status)); b.disabled = false; return; }
      msg(act + " OK" + (res.json.referral && res.json.referral.status !== "none" ? " · referral " + res.json.referral.status : ""));
      load();
    });
  });
}
$("#tok").value = tok;
$("#tokSave").onclick = () => { tok = $("#tok").value.trim(); sessionStorage.setItem(KEY, tok); unlock(); };
$("#tokClear").onclick = () => { tok = ""; sessionStorage.removeItem(KEY); $("#tok").value = ""; $("#ctl").hidden = true; $("#list").innerHTML = ""; $("#who").textContent = ""; };
document.querySelectorAll("#ctl [data-st]").forEach(b => b.onclick = () => { status = b.dataset.st; document.querySelectorAll("#ctl [data-st]").forEach(x => x.classList.toggle("on", x === b)); load(); });
$("#csv").onclick = async () => {
  const r = await api("/v1/admin/signals.csv?status=all");
  if (!r.ok) { msg("CSV failed: " + r.status); return; }
  const url = URL.createObjectURL(await r.blob()); const a = document.createElement("a"); a.href = url; a.download = "matrix-signals-log.csv"; a.click(); setTimeout(() => URL.revokeObjectURL(url), 2000);
};
$("#players").onclick = async () => {
  const r = await api("/v1/admin/players");
  if (r.status !== 200) { msg("Players failed"); return; }
  $("#list").innerHTML = `<div class="card"><h2>Players (${r.json.players.length})</h2>${r.json.players.map(p => `<div class="mute">${esc(p.handle)} · code ${esc(p.refCode)} · ${p.preview ? "preview · " : ""}referrals pending ${p.referrals.pending} / qualified ${p.referrals.qualified} · ledger ${esc(JSON.stringify(p.ledger))}</div>`).join("")}</div>`;
};
$("#purge").onclick = async () => {
  if (!confirm("Delete every player and signal created in preview mode?")) return;
  const r = await api("/v1/admin/purge-preview", { method: "POST", body: {} });
  msg(r.status === 200 ? `Purged ${r.json.deletedPlayers} preview player(s).` : "Purge failed: " + (r.json?.error || r.status)); load();
};
if (tok) unlock();
</script>
</body></html>
